name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          for f in $(git ls-files '*.json'); do
            python3 -m json.tool "$f" > /dev/null && echo "ok: $f" || { echo "invalid: $f"; exit 1; }
          done
